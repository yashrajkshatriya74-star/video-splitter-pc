name: Build Windows EXE and Installer (with bundled FFmpeg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller

      - name: Download FFmpeg (to bundle inside the app)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegDir = Get-ChildItem -Path ffmpeg_extracted -Directory | Select-Object -First 1
          Copy-Item "$($ffmpegDir.FullName)\bin\ffmpeg.exe" -Destination .
          Copy-Item "$($ffmpegDir.FullName)\bin\ffprobe.exe" -Destination .

      - name: Build EXE with PyInstaller (FFmpeg bundled inside)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "VideoSplitterPro" --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." main.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoSplitterPro-EXE-only
          path: dist/VideoSplitterPro.exe

      - name: Upload full Installer (recommended)
        uses: actions/upload-artifact@v4
        with:
          name: VideoSplitterPro-Setup-Installer
          path: installer_output/VideoSplitterPro_Setup.exe
